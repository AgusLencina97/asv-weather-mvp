spring.application.name=weather

# Secretos fuera del repositorio: se leen de variables de entorno o de un archivo .env local (ver .env.example).
# Si falta alguno, la aplicación no arranca (fail-fast) en lugar de fallar más tarde en tiempo de ejecución.
spring.config.import=optional:file:.env[.properties]

# Puerto del servidor
server.port=8080

# Configuración de Caché (Caffeine). Cada caché tiene su propia caducidad (ver CacheConfig)
weather.cache.municipios-ttl=24h
weather.cache.predicciones-ttl=1h
weather.cache.predicciones-max-size=1000

# Zona horaria de referencia para calcular "mañana" (la de AEMET)
weather.time-zone=Europe/Madrid

# Configuración de OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Aumentar timeouts de Feign porque el endpoint de municipios de AEMET es masivo y lento
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# Credenciales de acceso a la API
api.security.username=${API_USERNAME}
api.security.password=${API_PASSWORD}

# Configuración del Cliente AEMET
aemet.api.key=${AEMET_API_KEY}
