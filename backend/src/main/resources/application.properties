spring.application.name=weather

# Secretos: variables de entorno o archivo .env local (ver .env.example). Si falta alguno, la app no arranca
spring.config.import=optional:file:.env[.properties]

server.port=8080

# Caché (Caffeine)
weather.cache.municipios-ttl=24h
weather.cache.predicciones-ttl=1h
weather.cache.predicciones-max-size=1000

# Zona horaria para calcular "mañana" (la de AEMET)
weather.time-zone=Europe/Madrid

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# El listado de municipios de AEMET es grande y lento
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# Credenciales de acceso a la API
api.security.username=${API_USERNAME}
api.security.password=${API_PASSWORD}

# JWT (HS256): el secreto debe tener al menos 32 bytes
api.security.jwt.secret=${JWT_SECRET}
api.security.jwt.expiration=1h
api.security.jwt.issuer=asv-weather-api

# CORS
api.security.cors.allowed-origins=http://localhost:4200

# AEMET
aemet.api.key=${AEMET_API_KEY}
