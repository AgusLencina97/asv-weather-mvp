<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Acceso al Sistema</mat-card-title>
      <mat-card-subtitle>MVP ASV Weather</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" type="text" autocomplete="username" placeholder="Ej: admin">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" autocomplete="current-password">
        </mat-form-field>

        @if (errorMessage(); as message) {
          <p class="login-error" role="alert">{{ message }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="loginForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
