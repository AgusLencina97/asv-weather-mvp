<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Acceso al Sistema</mat-card-title>
      <mat-card-subtitle>MVP ASV Weather</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" type="text" placeholder="Ej: admin">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">
          Ingresar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
